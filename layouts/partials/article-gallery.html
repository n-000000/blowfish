{{- /*
  article-gallery.html — renders the sveltia `videos:` and `photos:` frontmatter arrays.
  videos -> dedicated video-gallery partial (native <video> player, above);
  photos -> responsive grid whose anchors GLightbox opens fullscreen (below).
  Each sub-gallery renders only when its field has >=1 item.

  Superseded the old single `gallery:` array that was split by file extension:
  the CMS now stores photos and videos in separate fields, so the type is known
  up front and no extension sniffing is needed.
*/ -}}

{{- /* ── Video gallery (dedicated, conditional) — above the photos ── */ -}}
{{- with .Params.videos -}}
  {{- partial "video-gallery.html" (dict "videos" . "site" $.Site) -}}
{{- end -}}

{{- /* ── Photo gallery: grid + GLightbox ── */ -}}
{{- with .Params.photos -}}
  {{- $alg := $.Site.Params.fingerprintAlgorithm | default "sha512" -}}
  <link rel="stylesheet" href="{{ (resources.Get "lib/glightbox/glightbox.min.css" | resources.Fingerprint $alg).RelPermalink }}">
  <div class="mt-gallery-grid">
    {{- range . }}
    <a href="{{ . }}" class="mt-glightbox" data-gallery="article-gallery">
      <img src="{{ . }}" alt="" loading="lazy" decoding="async">
    </a>
    {{- end }}
  </div>
  <script src="{{ (resources.Get "lib/glightbox/glightbox.min.js" | resources.Fingerprint $alg).RelPermalink }}"></script>
  <script src="{{ (resources.Get "js/gallery.js" | resources.Minify | resources.Fingerprint $alg).RelPermalink }}"></script>
{{- end -}}
